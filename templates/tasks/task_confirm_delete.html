{% extends 'tasks/base.html' %}

{% block content %}
<div class="mb-4">
    <h1 class="page-title text-danger">Delete Task</h1>
    <p class="page-subtitle">This action cannot be undone.</p>
</div>

<div class="card content-card p-4">
    <h4 class="mb-3">Are you sure you want to delete this task?</h4>

    <div class="alert alert-warning">
        <strong>{{ task.title }}</strong>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'task_detail' task.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
