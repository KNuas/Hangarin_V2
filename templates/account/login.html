{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hangarin Auth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #3b82f6);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-box {
            width: 100%;
            max-width: 500px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .card-box {
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.2);
        }

        .section-title {
            font-weight: 800;
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
        }

        .google-btn {
            width: 100%;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #1d4ed8;
        }

        .google-btn:hover {
            background: #dbeafe;
        }

        .google-icon {
            background: white;
            border-radius: 50%;
            padding: 4px 8px;
            font-weight: bold;
            color: #db4437;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
        }

        .btn-signin {
            background: #2563eb;
            color: white;
        }

        .btn-signin:hover {
            background: #1d4ed8;
        }

        .btn-outline {
            border: 2px solid #2563eb;
            color: #2563eb;
            background: white;
        }

        .btn-outline:hover {
            background: #eff6ff;
        }

        #signup-section {
            display: none;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container-box">
    <div class="title">Hangarin</div>

    <div class="card-box">

        <!-- SIGN IN -->
        <div id="signin-section">
            <div class="section-title">Sign In</div>
            <div class="subtitle">Access your account</div>

            <a href="{% provider_login_url 'google' %}" class="google-btn mb-3">
                <span class="google-icon">G</span>
                Continue with Google
            </a>

            <div class="text-center mb-3 text-muted">or</div>

            <form method="post" action="{% url 'account_login' %}">
                {% csrf_token %}

                <input type="text" name="login" class="form-control mb-3" placeholder="Username or Email" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <input type="checkbox" name="remember"> Remember me
                    </div>
                    <a href="{% url 'account_reset_password' %}">Forgot?</a>
                </div>

                <button class="btn btn-main btn-signin">SIGN IN</button>
            </form>

            <button class="btn btn-outline btn-main mt-3" onclick="showSignup()">
                Create Account
            </button>
        </div>

        <!-- SIGN UP -->
        <div id="signup-section">
            <div class="section-title">Sign Up</div>
            <div class="subtitle">Create your account</div>

            <form method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}

                <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" name="password1" class="form-control mb-3" placeholder="Password" required>
                <input type="password" name="password2" class="form-control mb-3" placeholder="Repeat Password" required>

                <button class="btn btn-main btn-signin">SIGN UP</button>
            </form>

            <button class="btn btn-outline btn-main mt-3" onclick="showSignin()">
                Back to Sign In
            </button>
        </div>

    </div>
</div>

<script>
function showSignup() {
    document.getElementById("signin-section").style.display = "none";
    document.getElementById("signup-section").style.display = "block";
}

function showSignin() {
    document.getElementById("signup-section").style.display = "none";
    document.getElementById("signin-section").style.display = "block";
}
</script>

</body>
</html>
