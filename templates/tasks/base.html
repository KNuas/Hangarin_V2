{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangarin</title>

    {% progressive_web_app_meta %}
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2ff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #1e3a8a, #2563eb, #3b82f6);
            color: white;
            padding: 2rem 1rem;
        }

        .sidebar .brand {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: block;
            color: white;
            text-decoration: none;
        }

        .sidebar .nav-link {
            color: white;
            font-weight: 600;
            border-radius: 12px;
            margin-bottom: 10px;
            padding: 12px 14px;
            transition: 0.3s ease;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .main-content {
            padding: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1e293b;
        }

        .page-subtitle {
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            border: none;
            border-radius: 1rem;
            color: white;
            text-align: center;
            padding: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-total { background: #3b82f6; }
        .stat-pending { background: #f59e0b; }
        .stat-progress { background: #6366f1; }
        .stat-completed { background: #22c55e; }

        .content-card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            transition: 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);
        }

        .table thead th {
            background: #eef2ff;
            color: #1e3a8a;
            border-bottom: none;
        }

        .badge-soft-pending {
            background: #fef3c7;
            color: #b45309;
        }

        .badge-soft-progress {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-soft-completed {
            background: #dcfce7;
            color: #166534;
        }

        .action-buttons .btn {
            margin-right: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row g-0">
        <div class="col-md-2 sidebar">
            <a href="{% url 'dashboard' %}" class="brand">Hangarin</a>

            <nav class="nav flex-column">
                <a href="{% url 'dashboard' %}" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="{% url 'task_list' %}" class="nav-link {% if '/tasks/' in request.path %}active{% endif %}">Tasks</a>
                <a href="{% url 'subtask_list' %}" class="nav-link {% if '/subtasks/' in request.path %}active{% endif %}">Sub Tasks</a>
                <a href="{% url 'note_list' %}" class="nav-link {% if '/notes/' in request.path %}active{% endif %}">Notes</a>
                <a href="{% url 'category_list' %}" class="nav-link {% if '/categories/' in request.path %}active{% endif %}">Categories</a>
                <a href="/admin/" class="nav-link">Admin</a>
                <a href="{% url 'account_logout' %}" class="nav-link">Logout</a>
            </nav>
        </div>

        <div class="col-md-10 main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
