{% extends 'tasks/base.html' %}

{% block content %}
<h1 class="page-title">{{ title }}</h1>

<div class="content-card p-4">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Title</label>
            {{ form.title }}
        </div>

        <div class="mb-3">
            <label>Description</label>
            {{ form.description }}
        </div>

        <div class="mb-3">
            <label>Deadline</label>
            {{ form.deadline }}
        </div>

        <div class="mb-3">
            <label>Status</label>
            {{ form.status }}
        </div>

        <div class="mb-3">
            <label>Category</label>
            {{ form.category }}
        </div>

        <div class="mb-3">
            <label>Priority</label>
            {{ form.priority }}
        </div>

        <button class="btn btn-success">Save</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
