{% extends 'tasks/base.html' %}

{% block content %}
<div class="mb-4">
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-subtitle">Fill in the details below.</p>
</div>

<div class="card content-card p-4">
    <form method="POST">
        {% csrf_token %}

        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label">Parent Task</label>
                {{ form.parent_task }}
            </div>

            <div class="col-md-12">
                <label class="form-label">Title</label>
                {{ form.title }}
            </div>

            <div class="col-md-12">
                <label class="form-label">Status</label>
                {{ form.status }}
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Save SubTask</button>
            <a href="{% url 'subtask_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
